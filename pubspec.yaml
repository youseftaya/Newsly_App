name: newsly
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# In Android, build-name is used as versionName while build-number used as versionCode.
# The version and the builder number may be overridden in flutter build by specifying --build-name and --build-number.
# Read more about Android versionName and versionCode at https://developer.android.com/studio/publish/versioning
# Read more about iOS CFBundleShortVersionString and CFBundleVersion for iOS
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the package versions below to
# the latest version available on pub.dev.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for the application.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by package dependencies.
  # The lint set provided by package dependencies.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see
# the following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application.
  uses-material-design: true

  # Add the .env file as an asset so Flutter can load the API key.
  assets:
    - assets/images/news_placeholder.jpg

  # To add assets to your application, add an assets section in the pubspec.yaml file:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific variants, see
  # https://docs.flutter.dev/ui/assets-and-images#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://docs.flutter.dev/packages-and-plugins/using-packages

  # For details regarding adding custom fonts to your application, see
  # https://docs.flutter.dev/ui/assets-and-images#resolution-aware

  # For example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding adding assets to your application, see
  # https://docs.flutter.dev/ui/assets-and-images#resolution-aware